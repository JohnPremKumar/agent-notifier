name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build before lint: type-aware ESLint rules
      # (@typescript-eslint/recommended-type-checked) need cross-package
      # `.d.ts` declarations to resolve types like Config from
      # @agent-notifier/core. Without dist/, every cross-package import
      # falls back to `error` type and the lint reports hundreds of
      # "Unsafe member access" errors. Locally this hides because dist/
      # is usually stale from prior builds.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
