name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # No registry-url here on purpose. setup-node's registry-url writes
          # ~/.npmrc with `_authToken=${NODE_AUTH_TOKEN}`, and any token in
          # the environment short-circuits OIDC. With pnpm >= 10.16 + a
          # configured Trusted Publisher on npmjs.com, omitting the token
          # path lets pnpm publish negotiate an OIDC token automatically.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
