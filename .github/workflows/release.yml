name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Trusted Publishing handshake.
      #
      # Why this is a manual step instead of relying on the publish tool:
      # `npm publish` (CLI 11.5.1+) negotiates OIDC automatically, but
      # `changesets/cli` detects pnpm and shells out to `pnpm publish`,
      # which does not yet implement the npm OIDC token-exchange flow.
      # Result: the publish runs unauthenticated and fails with ENEEDAUTH.
      #
      # We do the exchange ourselves: ask GitHub for an OIDC JWT scoped
      # to the npm registry, POST it to npm's exchange endpoint, get
      # back a short-lived npm publish token, write it to ~/.npmrc.
      # `pnpm publish` then reads the token like any other auth.
      # No long-lived secrets touch the runner; this token expires in
      # ~5 minutes and is never persisted beyond this job.
      #
      # Drop this step once pnpm gains native OIDC trusted-publishing
      # support (track: https://github.com/pnpm/pnpm/issues/9892).
      - name: Authenticate to npm via OIDC trusted publishing
        run: |
          set -euo pipefail
          # GitHub's OIDC endpoint URL-decodes the audience query param,
          # so we must URL-encode the colon. actions/core does the same
          # via encodeURIComponent in its getIDToken helper.
          AUD_RAW="npm:registry.npmjs.org"
          AUD_ENC="npm%3Aregistry.npmjs.org"
          OIDC_HTTP_CODE=$(curl -sS -o /tmp/oidc.json -w "%{http_code}" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD_ENC}")
          if [ "$OIDC_HTTP_CODE" != "200" ]; then
            echo "::error::GitHub OIDC token request failed (HTTP $OIDC_HTTP_CODE)"
            cat /tmp/oidc.json
            exit 1
          fi
          OIDC_TOKEN=$(jq -r '.value' < /tmp/oidc.json)
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::GitHub OIDC response missing .value"
            cat /tmp/oidc.json
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          EX_HTTP_CODE=$(curl -sS -o /tmp/ex.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "{\"id_token\":\"$OIDC_TOKEN\"}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/registry")
          if [ "$EX_HTTP_CODE" != "200" ]; then
            echo "::error::npm OIDC exchange failed (HTTP $EX_HTTP_CODE)"
            cat /tmp/ex.json
            exit 1
          fi
          NPM_TOKEN_OIDC=$(jq -r '.token' < /tmp/ex.json)
          if [ -z "$NPM_TOKEN_OIDC" ] || [ "$NPM_TOKEN_OIDC" = "null" ]; then
            echo "::error::npm exchange response missing .token"
            cat /tmp/ex.json
            exit 1
          fi
          echo "::add-mask::$NPM_TOKEN_OIDC"
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN_OIDC" >> ~/.npmrc
          rm -f /tmp/oidc.json /tmp/ex.json
          echo "OIDC trusted publishing: short-lived npm token written to ~/.npmrc"

      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
