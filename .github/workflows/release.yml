name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Trusted Publishing handshake.
      #
      # Why this is a manual step instead of relying on the publish tool:
      # `npm publish` (CLI 11.5.1+) negotiates OIDC automatically, but
      # `changesets/cli` detects pnpm and shells out to `pnpm publish`,
      # which does not yet implement the npm OIDC token-exchange flow.
      # Result: the publish runs unauthenticated and fails with ENEEDAUTH.
      #
      # The exchange protocol below is what `npm/cli`'s `lib/utils/oidc.js`
      # does internally:
      #   1. GET ${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:<registry-host>
      #      with `Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}`.
      #      Response body: `{"value": "<JWT>"}`.
      #   2. POST <registry>/-/npm/v1/oidc/token/exchange/package/<pkg>
      #      with the JWT as `Authorization: Bearer ${JWT}`. No request
      #      body. Response body: `{"token": "<short-lived npm token>"}`.
      # See https://github.com/npm/cli/blob/latest/lib/utils/oidc.js
      #
      # The token is short-lived and never persisted past this job. Same
      # security posture as native trusted publishing — just an explicit
      # step because the publishing tool is pnpm, not npm.
      #
      # Drop this step once pnpm gains native OIDC trusted-publishing
      # support (track: https://github.com/pnpm/pnpm/issues/9892).
      - name: Authenticate to npm via OIDC trusted publishing
        env:
          PKG_NAME: agent-notifier
          REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail

          # 1. Get a short-lived OIDC JWT from GitHub Actions, scoped to
          #    the npm registry. Audience must be URL-encoded; actions/core
          #    does this via encodeURIComponent in its getIDToken helper.
          AUD_ENC="npm%3A$(echo "$REGISTRY" | sed 's#https\?://##')"
          OIDC_HTTP=$(curl -sS -o /tmp/oidc.json -w "%{http_code}" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD_ENC}")
          if [ "$OIDC_HTTP" != "200" ]; then
            echo "::error::GitHub OIDC token request failed (HTTP $OIDC_HTTP)"
            cat /tmp/oidc.json
            exit 1
          fi
          OIDC_TOKEN=$(jq -r '.value' < /tmp/oidc.json)
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::GitHub OIDC response missing .value"
            cat /tmp/oidc.json
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"

          # 2. Exchange the JWT with npm for a short-lived publish token.
          #    The JWT goes in the Authorization header (this is what
          #    npm-registry-fetch does when given _authToken).
          EX_HTTP=$(curl -sS -o /tmp/ex.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Accept: application/json" \
            "${REGISTRY}/-/npm/v1/oidc/token/exchange/package/${PKG_NAME}")
          # npm returns 201 Created on successful exchange (observed in
          # production); some edges may return 200. Accept either.
          if [ "$EX_HTTP" != "200" ] && [ "$EX_HTTP" != "201" ]; then
            echo "::error::npm OIDC exchange failed (HTTP $EX_HTTP)"
            cat /tmp/ex.json
            exit 1
          fi
          NPM_TOKEN_OIDC=$(jq -r '.token' < /tmp/ex.json)
          if [ -z "$NPM_TOKEN_OIDC" ] || [ "$NPM_TOKEN_OIDC" = "null" ]; then
            echo "::error::npm exchange response missing .token"
            cat /tmp/ex.json
            exit 1
          fi
          echo "::add-mask::$NPM_TOKEN_OIDC"

          # 3. Write to ~/.npmrc so pnpm publish picks it up.
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN_OIDC" >> ~/.npmrc
          rm -f /tmp/oidc.json /tmp/ex.json
          echo "OIDC trusted publishing: short-lived npm token written to ~/.npmrc"

      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
